services:
  - type: web
    name: veyra-demo-api
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: VEYRA_AUTO_SEED
        value: "true"
      - key: DATABASE_URL
        value: sqlite:////tmp/veyra.db

  - type: web
    name: veyra-demo
    runtime: node
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://veyra-demo-api.onrender.com
